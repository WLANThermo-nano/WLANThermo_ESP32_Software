name: Nextion build (next branch – dev only)

on:
  pull_request:
    branches:
      - next
  push:
    branches:
      - next

jobs:
  build:

    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
    - name: Build nextion
      shell: pwsh
      run: |
        .\nextion\build.ps1
    - uses: actions/upload-artifact@v4
      with:
          name: nextion_artifacts_next
          path: ./nextion/artifacts
    - uses: actions/upload-artifact@v4
          if: always()                    # ← auch bei Fehler uploaden
            with:
              name: sikuli_debug_screenshot
              path: ${{ github.workspace }}/nextion/*.png
